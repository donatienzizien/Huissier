server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tout ce qui commence par /api est transmis au backend Node.js
    # (nom de service "backend" tel que défini dans docker-compose.yml,
    # les deux conteneurs communiquent via le réseau Docker interne).
    location /api {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fichiers volumineux (upload de logos, photos, pièces jointes)
        client_max_body_size 20M;
    }

    # Tout le reste : le frontend React (routage géré côté client par
    # React Router, d'où le repli systématique sur index.html).
    location / {
        try_files $uri $uri/ /index.html;
    }
}