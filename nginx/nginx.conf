# Remplacez DOMAINE.tld par votre nom de domaine réel avant déploiement.
# Ce fichier gère :
#  - app.DOMAINE.tld           -> page de connexion Super Admin / choix cabinet
#  - <slug-cabinet>.DOMAINE.tld -> frontend (React) avec sous-domaine tenant
#  - api.DOMAINE.tld           -> backend NestJS
#
# Le TenantMiddleware du backend lit le sous-domaine directement depuis le
# Host transmis par le frontend lors des appels /api — donc le frontend
# appelle toujours api.DOMAINE.tld, en précisant le cabinet via l'en-tête
# ou en étant lui-même servi sur le sous-domaine du cabinet (les deux
# stratégies du §3.2 du CDC sont supportées).

server {
    listen 80;
    server_name api.DOMAINE.tld;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 80;
    server_name *.DOMAINE.tld DOMAINE.tld;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name api.DOMAINE.tld;

    ssl_certificate     /etc/letsencrypt/live/DOMAINE.tld/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAINE.tld/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name *.DOMAINE.tld DOMAINE.tld;

    ssl_certificate     /etc/letsencrypt/live/DOMAINE.tld/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAINE.tld/privkey.pem;

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
